<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R For Robin</title>
    
    <style>
        img {
            width: 20vh;
        }
        
        #logo_wrapper {
            height: 20vh;
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            text-align: center; /* Center the text inside the wrapper */
        }
        
        p {
            font-family: Verdana, sans-serif;
            font-size: 5vh;
            margin: 0;
            text-align: center; /* Ensure text inside <p> is centered */
        }
        
        @media screen and (orientation: portrait) {
            width: 50vh;
        }
    </style>
</head>

<body>

    <div id="logo_wrapper">
        <a href="http://www.rforrobin.com/">
            <img src="r_for_robin.png" alt="R For Robin logo">
        </a>
        <p>Robin</p>
    </div>

</body>

</html>
